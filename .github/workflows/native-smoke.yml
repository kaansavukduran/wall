name: Check chapter 10 in the published WALL APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag containing the chapter 10 evidence
        type: string
        required: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      WALL_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$WALL_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*android*.apk'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play chapter 10 and route the four species
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node tests/android-kosiba-letter.mjs
