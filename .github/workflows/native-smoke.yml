name: WALL Android abrupt import acceptance
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate version
        type: string
        required: true
      previous_tag:
        description: Released prior version
        type: string
        required: true
      published:
        description: Download the exact published candidate
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      WALL_TAG: ${{ inputs.tag }}
      WALL_PREVIOUS_TAG: ${{ inputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: inputs.published != true
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.published != true
        with:
          gradle-version: '8.11.1'
      - name: Build the candidate APK
        if: inputs.published != true
        run: |
          test "$(cat VERSION)" = "$WALL_TAG"
          candidate_commit="$(git rev-parse HEAD^)"
          GITHUB_SHA="$candidate_commit" node scripts/build.mjs
          gradle -p android :app:assembleDebug
          mkdir candidate
          cp android/app/build/outputs/apk/debug/app-debug.apk candidate/
      - name: Download the published candidate
        if: inputs.published == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$WALL_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*android*.apk' --dir candidate
      - name: Download the released baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$WALL_PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*android*.apk' --dir baseline
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Transfer, stop immediately, reopen and read the save
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node tests/android-save-migration.mjs
