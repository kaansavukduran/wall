name: WALL Android virtual joystick verification
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing WALL release tag
        type: string
        required: true
      previous_tag:
        description: Earlier WALL release tag
        type: string
        required: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      WALL_TAG: ${{ inputs.tag }}
      WALL_PREVIOUS_TAG: ${{ inputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download both published APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$WALL_PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*android*.apk' --dir baseline
          gh release download "$WALL_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*android*.apk' --dir candidate
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Disconnect a kernel-backed virtual gamepad in both APKs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node tests/android-os-joystick.mjs
